version: '3.8'

services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: journal_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 2. Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: journal_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/journal
      - JWT_SECRET=supersecretdevkey12345678901234567890
      - CORS_ORIGIN=http://localhost:5173,http://localhost:3000,http://localhost:80
      - CLIENT_URL=http://localhost:80
    depends_on:
      - mongodb

  # 3. React Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: journal_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
    driver: local
